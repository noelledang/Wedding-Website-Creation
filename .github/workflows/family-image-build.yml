name: Build Family background

on:
  push:
    branches:
      - slideshow-walnut-preview
    paths:
      - ".github/workflows/family-image-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slideshow-walnut-preview

      - name: Rebuild sharp Family image
        shell: bash
        run: |
          set -euo pipefail

          cat             .tmp-final/family-0.b64             .tmp-final/family-1.b64             .tmp-final/family-2.b64             .tmp-final/family-3.b64             .tmp-final/family-4.b64             .tmp-final/family-5.b64             .tmp-final/family-6.b64             | base64 -d > public/images/family-mobile-branding.webp

          size=$(stat -c%s public/images/family-mobile-branding.webp)
          echo "Family image size: $size bytes"
          test "$size" -gt 35000
          file public/images/family-mobile-branding.webp

          rm -rf .tmp-final .tmp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install sharp Family background"
          git push origin HEAD:slideshow-walnut-preview
