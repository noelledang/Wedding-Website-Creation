name: Build Family HQ image

on:
  push:
    branches:
      - slideshow-walnut-preview
    paths:
      - ".github/workflows/family-hq-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slideshow-walnut-preview

      - name: Rebuild approved Family image
        shell: bash
        run: |
          set -euo pipefail

          cat             .tmp-hq/family-0.b64             .tmp-hq/family-1.b64             .tmp-hq/family-2.b64             .tmp-hq/family-3.b64             .tmp-hq/family-4.b64             .tmp-hq/family-5.b64             .tmp-hq/family-6.b64             .tmp-hq/family-7.b64             | base64 -d > public/images/family-mobile-branding.webp

          size=$(stat -c%s public/images/family-mobile-branding.webp)
          echo "Family image size: $size bytes"
          test "$size" -gt 220000
          file public/images/family-mobile-branding.webp

          python - <<'PY'
          from pathlib import Path
          p = Path("app/page.tsx")
          s = p.read_text()
          old = '/images/family-mobile.png'
          new = '/images/family-mobile-branding.webp'
          if old not in s:
              raise SystemExit("Expected Family image path not found")
          p.write_text(s.replace(old, new, 1))
          PY

          rm -rf .tmp-hq

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore sharp approved Family background"
          git push origin HEAD:slideshow-walnut-preview
