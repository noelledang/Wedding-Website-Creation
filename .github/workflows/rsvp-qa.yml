name: RSVP QA test
on:
  push:
    branches:
      - slideshow-walnut-preview
    paths:
      - ".github/workflows/rsvp-qa.yml"
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit QA RSVP
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST "https://noelle-nathan.vercel.app/api/mobile-rsvp" \
            -H "Content-Type: application/json" \
            --data '{"attending":"yes","guestCount":1,"guests":[{"name":"QA TEST - DELETE"}],"message":"Automated pre-production QA test from ChatGPT. Safe to delete."}')
          body=$(printf "%s" "$response" | sed '$d')
          code=$(printf "%s" "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          test "$code" = "200"
          echo "$body" | grep -q '"success":true'
